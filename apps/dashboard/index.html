<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMSOS Dashboard — Owner Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Feather / Lucide icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen">
    <div class="glass-panel auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <i data-lucide="message-square-code"></i>
        </div>
        <span class="brand-text">SMSOS v2</span>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to manage your micro-business</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="owner@smsos.in" required value="owner@smsos.in">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="admin123">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          <i data-lucide="log-in"></i> Sign In to Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- Main App View -->
  <div id="app" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <i data-lucide="message-square-code"></i>
        </div>
        <span class="brand-text">SMSOS</span>
      </div>

      <ul class="nav-list">
        <li class="nav-item active" data-route="orders">
          <a href="#orders">
            <i data-lucide="shopping-bag"></i>
            <span class="nav-text">Orders</span>
          </a>
        </li>
        <li class="nav-item" data-route="catalog">
          <a href="#catalog">
            <i data-lucide="book-open"></i>
            <span class="nav-text">Catalog</span>
          </a>
        </li>
        <li class="nav-item" data-route="customers">
          <a href="#customers">
            <i data-lucide="users"></i>
            <span class="nav-text">Customers</span>
          </a>
        </li>
        <li class="nav-item" data-route="reservations">
          <a href="#reservations">
            <i data-lucide="calendar"></i>
            <span class="nav-text">Reservations</span>
          </a>
        </li>
        <li class="nav-item" data-route="conversations">
          <a href="#conversations">
            <i data-lucide="message-circle"></i>
            <span class="nav-text">AI Conversations</span>
          </a>
        </li>
        <li class="nav-item" data-route="analytics">
          <a href="#analytics">
            <i data-lucide="bar-chart-3"></i>
            <span class="nav-text">Analytics</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-user">
        <div class="user-info">
          <div class="avatar" id="user-avatar">O</div>
          <div class="user-details">
            <div class="name" id="user-name">Business Owner</div>
            <div class="role">Admin</div>
          </div>
        </div>
        <button id="logout-btn" class="btn-icon" title="Logout">
          <i data-lucide="log-out"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="content-area">
      <header class="header-bar">
        <div class="header-title">
          <h1 id="page-title">Orders Dashboard</h1>
          <p id="page-subtitle">Manage customer orders and status updates</p>
        </div>
        <div class="header-actions" id="header-actions">
          <!-- Dynamic Action Buttons -->
        </div>
      </header>

      <!-- Dynamic View Container -->
      <div id="main-view">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modal-root" class="modal-overlay">
    <!-- Rendered dynamically -->
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- App Script -->
  <script src="js/app.js"></script>
</body>
</html>
